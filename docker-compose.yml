services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: driverhub
      POSTGRES_PASSWORD: driverhub
      POSTGRES_DB: driverhub
    ports:
      - "5433:5432"
    volumes:
      - driverhub_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driverhub -d driverhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://driverhub:driverhub@postgres:5432/driverhub?schema=public
      SESSION_SECRET: docker-development-session-secret-32-characters
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://driverhub:driverhub@postgres:5432/driverhub?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  driverhub_postgres:
